<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SIDFAM{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 32C14 16 50 16 60 32 50 48 14 48 4 32Z' fill='none' stroke='%2338bdf8' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%2338bdf8'/%3E%3C/svg%3E">
    <style>
        /* Mismos tokens que app/templates/dashboard.html */
        :root {
            --bg: #030712;
            --ink: #eaf1ff;
            --ink-2: #b4c3df;
            --muted: #7d8fb3;
            --glass: rgba(12, 20, 40, 0.55);
            --glass-2: rgba(16, 26, 52, 0.72);
            --line: rgba(140, 180, 255, 0.14);
            --line-2: rgba(140, 180, 255, 0.28);
            --cyan: #38bdf8;
            --verde: #34d399;
            --ambar: #fbbf24;
            --rojo: #fb7185;
            --violeta: #c084fc;
            --gris: #94a3b8;
            --accent: var(--cyan);
            --radius: 22px;
            --shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.85);
            --font: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
            --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: var(--font); color: var(--ink); background: var(--bg);
            min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }
        button, input, select { font: inherit; color: inherit; }
        a { color: var(--cyan); }

        .bg { position: fixed; inset: 0; z-index: -3; overflow: hidden; }
        .bg-img {
            position: absolute; inset: -4%;
            background: url("/imagenes/fondo.png") center / cover no-repeat;
            filter: saturate(1.15) brightness(0.62);
            transform: translate3d(var(--px, 0), var(--py, 0), 0) scale(1.06);
            transition: transform 0.6s cubic-bezier(.2,.7,.2,1);
        }
        .bg-veil {
            position: absolute; inset: 0;
            background:
                radial-gradient(1000px 650px at 12% -10%, rgba(56, 189, 248, 0.20), transparent 60%),
                radial-gradient(900px 600px at 110% 10%, rgba(192, 132, 252, 0.16), transparent 55%),
                linear-gradient(180deg, rgba(3, 7, 18, 0.45) 0%, rgba(3, 7, 18, 0.8) 60%, rgba(3, 7, 18, 0.94) 100%);
        }
        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(120, 170, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 170, 255, 0.05) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
            animation: gridmove 18s linear infinite;
        }
        @keyframes gridmove { to { background-position: 56px 56px, 56px 56px; } }

        .glass {
            position: relative; border-radius: var(--radius);
            background: var(--glass); border: 1px solid var(--line);
            backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
            box-shadow: var(--shadow); isolation: isolate;
        }
        .glass::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
            background: radial-gradient(260px circle at var(--mx, -999px) var(--my, -999px), rgba(140, 200, 255, 0.55), transparent 60%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
        }

        /* Formularios */
        .field { display: grid; gap: 7px; }
        .field label { font-size: 0.78rem; color: var(--ink-2); font-weight: 500; letter-spacing: 0.02em; }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-wrap > svg { position: absolute; left: 14px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; transition: color 0.2s; }
        .input, select.input {
            width: 100%; padding: 13px 14px; border-radius: 13px;
            background: rgba(4, 9, 22, 0.6); border: 1px solid var(--line-2);
            outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .input-wrap > svg + .input { padding-left: 42px; }
        .input:focus { border-color: rgba(56, 189, 248, 0.7); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.14); background: rgba(4, 9, 22, 0.8); }
        .input-wrap:focus-within > svg { color: var(--cyan); }
        select.input { appearance: none; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
        select.input option { background: #0b1220; }
        .eye-btn { position: absolute; right: 8px; border: 0; background: transparent; padding: 7px; border-radius: 9px; cursor: pointer; color: var(--muted); display: grid; }
        .eye-btn:hover { color: var(--ink); background: rgba(140, 180, 255, 0.1); }
        .eye-btn svg { width: 18px; height: 18px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 9px;
            padding: 12px 18px; border-radius: 13px; border: 1px solid transparent; cursor: pointer;
            font-weight: 600; text-decoration: none; transition: transform 0.15s, box-shadow 0.25s, background 0.25s, border-color 0.25s;
        }
        .btn:active { transform: scale(0.98); }
        .btn svg { width: 17px; height: 17px; }
        .btn-primary {
            color: #031322; position: relative; overflow: hidden;
            background: linear-gradient(110deg, #38bdf8, #818cf8 55%, #c084fc);
            box-shadow: 0 12px 30px -10px rgba(56, 189, 248, 0.7);
        }
        .btn-primary:hover { box-shadow: 0 16px 40px -10px rgba(129, 140, 248, 0.85); }
        .btn-primary::after {
            content: ""; position: absolute; inset: 0; transform: translateX(-120%);
            background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.45), transparent 70%);
            transition: transform 0.8s ease;
        }
        .btn-primary:hover::after { transform: translateX(120%); }
        .btn-primary[disabled] { opacity: 0.7; cursor: progress; }
        .btn-ghost { background: rgba(140, 180, 255, 0.08); border-color: var(--line); color: var(--ink-2); }
        .btn-ghost:hover { background: rgba(140, 180, 255, 0.16); border-color: var(--line-2); color: var(--ink); }
        .btn-danger { background: rgba(251, 113, 133, 0.12); border-color: rgba(251, 113, 133, 0.4); color: #fecdd3; }
        .btn-danger:hover { background: rgba(251, 113, 133, 0.22); }
        .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(3,19,34,0.3); border-top-color: #031322; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .alert {
            display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 13px; font-size: 0.86rem; line-height: 1.4;
            background: rgba(251, 113, 133, 0.1); border: 1px solid rgba(251, 113, 133, 0.4); color: #fecdd3;
            animation: shake 0.45s cubic-bezier(.36,.07,.19,.97);
        }
        .alert svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
        .alert.ok { background: rgba(52, 211, 153, 0.1); border-color: rgba(52, 211, 153, 0.4); color: #a7f3d0; animation: none; }
        .alert.info { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.4); color: #bae6fd; animation: none; }
        @keyframes shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(3px); } 30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

        .role-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
            font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--ink); background: color-mix(in srgb, var(--c) 18%, transparent);
            border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
        }
        .role-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
        .r-administrador { --c: var(--violeta); }
        .r-supervisor { --c: var(--cyan); }
        .r-conductor { --c: var(--verde); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }
        {% block styles %}{% endblock %}
    </style>
</head>
<body>
    <div class="bg" aria-hidden="true">
        <div class="bg-img" id="bg-img"></div>
        <div class="bg-grid"></div>
        <div class="bg-veil"></div>
    </div>

    {% block content %}{% endblock %}

    <script>
        // Parallax del fondo y borde luminoso que sigue al cursor (como en el panel)
        (() => {
            const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
            let raf = null;
            document.addEventListener("pointermove", (e) => {
                if (raf) return;
                raf = requestAnimationFrame(() => {
                    raf = null;
                    if (!reduced) {
                        const bg = document.getElementById("bg-img");
                        bg.style.setProperty("--px", ((e.clientX / innerWidth - 0.5) * -24) + "px");
                        bg.style.setProperty("--py", ((e.clientY / innerHeight - 0.5) * -16) + "px");
                    }
                    document.querySelectorAll(".glass").forEach(el => {
                        const r = el.getBoundingClientRect();
                        el.style.setProperty("--mx", (e.clientX - r.left) + "px");
                        el.style.setProperty("--my", (e.clientY - r.top) + "px");
                    });
                });
            });
            // Mostrar/ocultar contraseña
            document.querySelectorAll("[data-toggle-pw]").forEach(btn => btn.addEventListener("click", () => {
                const input = document.getElementById(btn.dataset.togglePw);
                const show = input.type === "password";
                input.type = show ? "text" : "password";
                btn.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña");
                btn.querySelector(".slash").style.display = show ? "none" : "";
            }));
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
